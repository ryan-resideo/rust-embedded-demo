[package]
name = "red-fw"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"

[patch.crates-io]
postcard = { git = "https://github.com/jamesmunns/postcard.git", branch = "main" }

[dependencies]
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
    "defmt",
] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-stm32 = { version = "0.6.0", features = [
    "stm32f429zi",
    "memory-x",
    "rt",
    "time-driver-any",
    "defmt",
] }
embassy-time = { version = "0.5.1", features = [
    "defmt",
    "defmt-timestamp-uptime-ms",
] }
embassy-futures = "0.1.2"
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.6"
heapless = { version = "0.9.2", features = ["defmt"] }

defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

bme280-rs = { version = "0.4.1", default-features = false, features = ["async"] }

red-core = { path = "../core", features = ["defmt"] }
red-proto = { path = "../proto", features = ["defmt"] }

[profile.dev]
opt-level = "s"
debug = 2

[profile.release]
opt-level = "s"
debug = 2
lto = "fat"
codegen-units = 1
