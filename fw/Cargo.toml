[package]
name = "red-fw"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
embassy-executor = { version = "0.10.0", features = [
    "platform-cortex-m",
    "executor-thread",
] }
embassy-sync = "0.8.0"
embassy-stm32 = { version = "0.6.0", features = [
    "stm32f429zi",
    "memory-x",
    "rt",
    "time-driver-any",
] }
embassy-time = "0.5.1"
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.6"
heapless = "0.9.2"
panic-probe = "1.0.0"

red-core = { path = "../core" }
red-proto = { path = "../proto" }

[profile.dev]
opt-level = "s"
debug = 2

[profile.release]
opt-level = "s"
debug = 2
lto = "fat"
codegen-units = 1
