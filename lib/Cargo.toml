[package]
name = "red-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
nusb = { version = "0.2.5", features = ["tokio"] }
postcard = "1.1.3"
thiserror = "2.0"
tokio = { version = "1.53.1", features = ["io-util", "time"] }
tracing = "0.1.44"

red-proto = { path = "../proto" }

[dev-dependencies]
heapless = "0.9.3"
tokio = { version = "1.53.1", features = ["io-util", "time", "macros", "rt", "sync"] }
