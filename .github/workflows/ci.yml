name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Configure toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        build-warnings: deny
        components: rustfmt, clippy
        cache-workspaces: |
          . -> target
          fw -> target

    - name: Check formatting (main)
      run: cargo fmt --all --check

    - name: Check formatting (fw)
      working-directory: fw
      run: cargo fmt --all --check

    - name: Clippy (main)
      run: cargo clippy --workspace --all-targets --locked -- -D warnings
    - name: Clippy (fw)
      working-directory: fw
      run: cargo clippy --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Configure toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        build-warnings: deny


    - name: Run tests
      run: cargo test --workspace --all-features --locked

  cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
    - uses: actions/checkout@v7

    - name: Configure toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        target: ${{ matrix.target }}
        build-warnings: deny
        cache-key: ${{ matrix.target }}

    - name: Build CLI
      run: cargo build --package red-cli --release --locked --target ${{ matrix.target }}

    - name: Upload CLI binary
      uses: actions/upload-artifact@v7
      with:
        name: red-cli-${{ matrix.target }}
        path: target/${{ matrix.target }}/release/red-cli${{ matrix.os == 'windows-latest' && '.exe' || '' }}
        if-no-files-found: error

  fw:
    name: Build firmware
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Configure toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        target: thumbv7em-none-eabihf
        build-warnings: deny
        cache-workspaces: fw -> target
  
    - name: Build firmware
      working-directory: fw
      run: cargo build --release --locked

    - name: Upload firmware ELF
      uses: actions/upload-artifact@v7
      with:
        name: red-fw
        path: fw/target/thumbv7em-none-eabihf/release/red-fw
        if-no-files-found: error
